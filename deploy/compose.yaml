services:
  lekka:
    build: ..
    image: lekka
    restart: unless-stopped
    # Who the server runs as. Set PUID and PGID in .env to your own `id -u` and
    # `id -g` when you mount a directory of your own, and nothing needs chowning.
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      PORT: 8080
      DATA_DIR: /data
      # CREATE_TOKEN: set this to keep anyone on the network from adding cards
      # TTL_DAYS: set this to delete cards nobody has opened for that long
    ports:
      - "8380:8080"
    volumes:
      - lekka-data:/data
      # Or keep the cards in a directory of your own, and set PUID/PGID above:
      # - ./data:/data

volumes:
  lekka-data:
