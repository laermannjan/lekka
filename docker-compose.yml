services:
  lekka:
    build: .
    ports:
      - '3000:3000'
    environment:
      # Required by SvelteKit's Node adapter to accept form/action POSTs —
      # without it every submission 403s as a cross-site request. Set this to
      # the URL you actually reach the instance at (scheme + host + port).
      - ORIGIN=http://localhost:3000
    volumes:
      - lekka-data:/app/data
    restart: unless-stopped

volumes:
  lekka-data:
