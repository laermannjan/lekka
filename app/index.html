<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lekka — Rezeptkarten</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/stil.css">
<meta name="theme-color" content="#1E6B4C">

<div class="karte">
  <div class="kopf">
    <h1>Rezeptkarten</h1>
    <div class="angaben"><span>auf diesem Gerät bekannt</span></div>
  </div>

  <div class="leiste werkzeuge">
    <div class="gruppe">
      <button class="knopf" id="neu">Neue Karte</button>
      <button class="knopf still" id="einlesen">Importieren</button>
      <button class="knopf still" id="sichern">Alle exportieren</button>
      <input type="file" id="datei" accept="application/json,.json" hidden>
    </div>
  </div>

  <div class="hinweisfeld" id="meldung" role="status"></div>

  <div class="rumpf">
    <p class="grau">Der Server führt keine Liste; eine Karte findet nur, wer ihren Link hat.</p>
    <ul class="karten" id="karten"></ul>
    <p class="grau" id="leer" hidden>Noch nichts hier. Lege eine Karte an oder öffne einen Link.</p>
  </div>
</div>

<script type="module" src="/uebersicht.js"></script>
</html>
