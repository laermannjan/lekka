[tools]
node = "22"

[env]
PORT = "8080"
DATA_DIR = "./data"

[tasks.serve]
description = "App and API on $PORT, restarted when a server file changes"
usage = 'arg "[port]" help="Listen here instead of $PORT"'
run = 'PORT="${usage_port:-$PORT}" exec npm run serve'

[tasks.test]
description = "Run the tests once"
run = "npm test"

[tasks.check]
description = "Drive the editor in a real browser"
run = "npm run check"

[tasks.show]
description = "Draw a card in the terminal"
run = "npm run show --"

[tasks.up]
description = "Build and start the container (http://localhost:8380)"
dir = "deploy"
run = "docker compose up -d --build"

[tasks.down]
description = "Stop the container"
dir = "deploy"
run = "docker compose down"

[tasks.logs]
description = "Follow the container logs"
dir = "deploy"
run = "docker compose logs -f"
