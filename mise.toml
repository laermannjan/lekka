[tools]
node = "22"

[env]
PORT = "8080"
DATA_DIR = "./data"

[tasks.serve]
description = "App and API on $PORT, restarted when a server file changes"
usage = 'arg "[port]" help="Listen here instead of $PORT"'
# `--watch` reloads on a change to anything the server imports, which is `server/` and the
# two modules it shares with the app. It deliberately does not reach the rest of `app/`:
# those are read from disk on every request, so a browser reload is already enough, and a
# restart for them would drop the connection for nothing.
#
# The port is named once, in [env] above. An argument overrides it for one run.
run = 'PORT="${usage_port:-$PORT}" exec node --watch server/main.js'

[tasks.test]
description = "Run the tests once"
run = "node --test"

[tasks.show]
description = "Draw a card in the terminal"
run = "node tools/show.mjs"

[tasks.up]
description = "Build and start the container (http://localhost:8380)"
dir = "deploy"
run = "docker compose up -d --build"

[tasks.down]
description = "Stop the container"
dir = "deploy"
run = "docker compose down"

[tasks.logs]
description = "Follow the container logs"
dir = "deploy"
run = "docker compose logs -f"
