[tools]
node = "22"

[env]
PORT = "8080"
DATA_DIR = "./data"

[tasks.serve]
description = "App und API auf $PORT, ohne Build"
run = "node server/main.js"

[tasks.test]
description = "Tests einmal laufen lassen"
run = "node --test"

[tasks.show]
description = "Eine Karte im Terminal zeichnen"
run = "node tools/show.mjs"

[tasks.up]
description = "Container bauen und starten (http://localhost:8380)"
dir = "deploy"
run = "docker compose up -d --build"

[tasks.down]
description = "Container stoppen"
dir = "deploy"
run = "docker compose down"

[tasks.logs]
description = "Container-Logs verfolgen"
dir = "deploy"
run = "docker compose logs -f"
