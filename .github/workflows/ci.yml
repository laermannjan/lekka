name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run check

      # Kept separate from `pnpm run test` even though the e2e web server
      # builds too: this one runs with no DATABASE_URL in the environment,
      # which is the thing that has to keep working.
      - run: pnpm run build

      - run: pnpm run test
